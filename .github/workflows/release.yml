name: Release

# Builds installable packages for all three platforms and publishes them to
# a GitHub Release - the thing install.sh/install.ps1 (repo root) actually
# download. Separate from ci.yml (which just builds/tests on every push)
# since this is considerably more expensive and only needs to run when
# cutting a release.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without a leading v (e.g. 1.2.0). Only used for manual test runs - a tag push derives this from the tag itself.'
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: prepare
    runs-on: windows-latest
    env:
      APO_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.0
          arch: win64_msvc2022_64
          cache: true

      - name: Clone and bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg/installed
            ~/.cache/vcpkg/archives
          key: vcpkg-release-Windows-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DAPO_VERSION="${{ env.APO_VERSION }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: cmake --build build --config Release --target package_zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: build/apophysis7x-*-win64.zip
          if-no-files-found: error

  build-macos:
    needs: prepare
    runs-on: macos-latest
    env:
      APO_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # See ci.yml for why macOS is pinned to 6.9.2 rather than the 6.8.0
      # Linux/Windows use (QTBUG-137687 - Qt 6.8.0's prebuilt macOS
      # binaries reference the AGL.framework Apple removed in Xcode 26).
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.2
          cache: true

      - name: Clone and bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg/installed
            ~/.cache/vcpkg/archives
          key: vcpkg-release-macOS-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ runner.temp }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DAPO_VERSION=${{ env.APO_VERSION }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cmake --build build --target package_zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: build/apophysis7x-*-macos-*.zip
          if-no-files-found: error

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      APO_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Qt runtime + AppImage packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxkbcommon0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libfontconfig1 imagemagick

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.0
          cache: true

      - name: Clone and bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg/installed
            ~/.cache/vcpkg/archives
          key: vcpkg-release-Linux-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ runner.temp }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          mkdir -p dist
          packaging/linux-appimage.sh build "${{ env.APO_VERSION }}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/apophysis7x-*-x86_64.AppImage
          if-no-files-found: error

  publish:
    needs: [prepare, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Apophysis 7X ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
